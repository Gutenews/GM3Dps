[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "GM3Dps"
version = "0.0.1"
description = "A package to create 3D (and 2D) Postscript figure in Python"
readme = "README.md"
authors  = [{name = "Yannis Benchaib--Langon", email = "yannis.benchaib-langon@student.isae-supaero.fr"}]
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
keywords = [
    "geometry", 
    "postscript"
]
dependencies = [
    "numpy>=2.4.0"
]

[project.urls]
Homepage = "https://github.com/Gutenews/GM3Dps"

[tool.setuptools]
packages = ["GM3Dps"]
package-dir = {"" = "."}